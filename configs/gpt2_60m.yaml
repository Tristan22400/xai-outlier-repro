# ~60M-parameter GPT-2 for the softmax-1 / OrthoAdam reproduction.
# Shared by all three variants — never tune per-variant.
model:
  n_layer: 12
  n_embd: 512
  n_head: 8
  n_inner: 2048
  n_positions: 256
  n_ctx: 256
  vocab_size: 50257
  activation_function: gelu_new
  resid_pdrop: 0.0
  embd_pdrop: 0.0
  attn_pdrop: 0.0
  layer_norm_epsilon: 1.0e-5
  initializer_range: 0.02
  tie_word_embeddings: true
  bos_token_id: 50256
  eos_token_id: 50256

training:
  seq_len: 256
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 8          # effective batch = 32 seqs = 8192 tokens/step
  learning_rate: 1.0e-3
  min_learning_rate: 1.0e-4
  warmup_steps: 2000
  lr_scheduler_type: cosine
  weight_decay: 0.1
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_epsilon: 1.0e-8
  max_grad_norm: 1.0
  max_steps: 100000
  eval_steps: 2000
  logging_steps: 50
  save_steps: 10000
  gradient_checkpointing: true
  fp16: false                             # fp16 diverges on P100 per prior experience
  bf16: false                             # sm_60 has no bf16
  seed: 42
  wallclock_hours: 34.0                   # leave 2h of the 36h reservation for final eval
  wandb_project: xai-outlier-repro

orthoadam:
  max_rotate_dim: 4096                    # vocab axis (50257) stays identity
  seed: 0
