name: xai-repro
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pytorch=2.1.2
  - pytorch-cuda=11.8
  - pip:
      - transformers>=4.40,<4.50
      - datasets>=2.18
      - accelerate>=0.29
      - evaluate>=0.4
      - wandb>=0.17
      - numpy<2
      - pyyaml>=6
      - ruff>=0.4
      - black>=24.3
      - mypy>=1.10
      - pytest>=8.0
      - types-PyYAML
      - -e .
